name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # read each forwarder's target url straight from the script so the
      # check never drifts from what machlang.org/install.{sh,ps1} actually fetch
      - name: HEAD the forwarder targets
        run: |
          set -eu
          for f in install.sh install.ps1; do
            url=$(grep -oE 'https://[^"| ]+' "$f" | head -n1)
            echo "$f -> $url"
            curl -fsSIL -o /dev/null "$url"
          done

  bake-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bake the latest mach release into version.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bake-version.sh

      - name: Check the baked module loads with the version
        run: node -e 'const v = require("./assets/version.js").MACH_VERSION; if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("bad version: " + v); process.exit(1) } console.log(v)'

  gate:
    if: always()
    needs: [install-check, bake-version]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # read each forwarder's target url straight from the script so the
      # check never drifts from what machlang.org/install.{sh,ps1} actually fetch
      - name: HEAD the forwarder targets
        run: |
          set -eu
          for f in install.sh install.ps1; do
            url=$(grep -oE 'https://[^"| ]+' "$f" | head -n1)
            echo "$f -> $url"
            curl -fsSIL -o /dev/null "$url"
          done

  gate:
    if: always()
    needs: [install-check]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}

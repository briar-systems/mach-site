name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # read each forwarder's target url straight from the script so the
      # check never drifts from what machlang.org/install.{sh,ps1} actually fetch
      - name: HEAD the forwarder targets
        run: |
          set -eu
          for f in public/install.sh public/install.ps1; do
            url=$(grep -oE 'https://[^"| ]+' "$f" | head -n1)
            echo "$f -> $url"
            curl -fsSIL -o /dev/null "$url"
          done

  bake-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bake the latest mach release into version.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bake-version.sh

      - name: Run the version.js tests against the baked file
        run: node --test test/version.test.js

  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the ecosystem page tests
        run: node --test test/ecosystem.test.js

  # the catalog bake only the pages deploy uses, removed at the cutover
  pages-bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the bake tests
        run: node --test test/bake.test.js

      - name: Bake the ecosystem catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/bake-ecosystem.js

  highlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the highlighter tests
        run: node --test test/highlight.test.js

  llms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bake the latest mach release into version.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bake-version.sh

      - name: Run the llms tests
        run: node --test test/llms.test.js

      - name: Build llms.txt and llms-full.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-llms.js

      - name: Check every link in both files
        run: node .github/scripts/check-links.js

  # the image railway builds: its formatting, its build, every file it serves
  # and the catalog, then a SIGTERM that must drain and exit 0
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the server's formatting
        run: |
          docker build --target build -t site-build .
          docker run --rm site-build mach fmt --check .

      - name: Build the server image
        run: docker build -t site .

      # the catalog reads a local stub of github, which the catalog test
      # starts after checking the cold start without it
      - name: Serve the site and the catalog from the image and check them
        run: |
          set -eu
          mkdir -p out/volume
          chmod 777 out/volume
          sed -e 's|^entries_url = .*|entries_url = "http://127.0.0.1:18212/entries.json"|' \
              -e 's|^graphql_url = .*|graphql_url = "http://127.0.0.1:18212/graphql"|' \
              hedge.toml > out/stub.toml
          # the first argument, when given, is the snapshot path the volume keeps
          serve() {
            docker run -d --network host -e LISTEN=127.0.0.1:8080 \
              -e GITHUB_TOKEN=test-token -e ECOSYSTEM_WEBHOOK_SECRET=test-secret \
              ${1:+-e ECOSYSTEM_SNAPSHOT_PATH="$1"} \
              -v "$PWD/out/stub.toml:/srv/site/stub.toml:ro" -v "$PWD/out/volume:/data" \
              site /srv/site/stub.toml
          }
          up() {
            for i in $(seq 1 50); do
              if curl -sf -o /dev/null http://127.0.0.1:8080/healthz; then return 0; fi
              sleep 0.2
            done
            return 1
          }
          stop() {
            docker stop -t 30 "$1"
            docker logs "$1" 2>&1 | grep -v 'request' | tail -n 5
            test "$(docker inspect -f '{{.State.ExitCode}}' "$1")" = 0
          }
          cid=$(serve /data/ecosystem.json)
          up
          SITE_URL=http://127.0.0.1:8080 node --test test/serve.test.js
          SITE_URL=http://127.0.0.1:8080 STUB_PORT=18212 STUB_TOKEN=test-token \
            WEBHOOK_SECRET=test-secret node --test test/catalog.test.js
          stop "$cid"
          # the stub is gone with its test, so github is unreachable: a restart
          # serves the catalog kept on the volume and reports its age
          cid=$(serve /data/ecosystem.json)
          up
          curl -fsS http://127.0.0.1:8080/ecosystem.json | grep -q '"id":"fresh"'
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '^catalog_age_seconds [0-9]'
          stop "$cid"
          # without a snapshot path nothing is kept or loaded, whatever the
          # volume holds: a cold boot with github unreachable has no catalog
          cid=$(serve)
          up
          test "$(curl -sS http://127.0.0.1:8080/healthz)" = "$(printf 'ok\ncatalog_generated none')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ecosystem.json)" = 503
          stop "$cid"

  gate:
    if: always()
    needs: [install-check, bake-version, ecosystem, pages-bake, highlight, llms, container]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}

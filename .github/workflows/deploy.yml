name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # started on main by redeploy.yml when a mach release lands
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Bake the latest mach release into version.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bake-version.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5

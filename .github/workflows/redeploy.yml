name: Redeploy on mach release

# briar-systems/mach's release workflow sends a repository_dispatch of type
# mach-release. a dispatch run happens on the default branch, and the
# github-pages environment only admits main, so this starts deploy.yml on main.
on:
  repository_dispatch:
    types: [mach-release]

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start the Pages deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.tag }}
        run: |
          echo "mach release: ${RELEASE:-unspecified}"
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main

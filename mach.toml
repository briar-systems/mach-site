[project]
id      = "site"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[artifact.site]
kind    = "bin"
entry   = "bin/main.mach"
out     = "{project.work}/bin/site"
targets = ["*"]
link    = []
need    = []

# every dependency of the closure is named here at an exact release tag, so a
# checkout without git metadata, such as a container build context, realizes
# the same tree the committed gitlinks pin. the ones this project does not
# import itself are reached through hedge and laurel.
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v10.1.1"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.26.0"

[dep.hedge]
git = "https://github.com/briar-systems/hedge"
ref = "tag/v0.19.1"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
ref = "tag/v0.24.1"

[dep.graft]
git = "https://github.com/briar-systems/graft"
ref = "tag/v0.5.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.30.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "tag/v0.18.1"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.28.0"

[dep.acme]
git = "https://github.com/briar-systems/mach-acme"
ref = "tag/v0.15.0"

[dep.pki]
git = "https://github.com/briar-systems/mach-pki"
ref = "tag/v0.5.0"

[dep.encoding]
git = "https://github.com/briar-systems/mach-encoding"
ref = "tag/v0.1.0"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
ref = "tag/v0.1.0"

[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
ref = "tag/v0.1.0"
